name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pip-audit ruff

      - name: Lint (ruff)
        run: |
          ruff check cipher tests cipher_cli.py

      - name: Static compile check
        run: |
          python -m compileall cipher cipher_cli.py tests

      - name: Run tests
        run: |
          pytest -q

      - name: Dependency audit (informational)
        continue-on-error: true
        run: |
          pip-audit
